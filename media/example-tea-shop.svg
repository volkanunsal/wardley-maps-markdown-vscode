<svg xmlns="http://www.w3.org/2000/svg" width="905" height="637" viewBox="-35 -45 905 637" version="1.1">
<defs>
  <linearGradient id="wardleyGradient" x1="0%" x2="100%" y1="0%" y2="0%">
    <stop offset="0%" style="stop-color:rgb(196,196,196);stop-opacity:1"/>
    <stop offset="0.3" style="stop-color:white;stop-opacity:1"/>
    <stop offset="0.7" style="stop-color:white"/>
    <stop offset="1" style="stop-color:rgb(196,196,196)"/>
  </linearGradient>
  <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
    <stop offset="40%" style="stop-color:#808080;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#808080;stop-opacity:1"/>
  </linearGradient>
  <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="4" height="4">
    <path d="M 3,-1 l 2,2 M 0,0 l 4,4 M -1,3 l 2,2" stroke="grey" stroke-width="1" opacity=".5"/>
  </pattern>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="15" refY="0" viewBox="0 -5 10 10" orient="0">
    <path d="M0,-5L10,0L0,5" fill="red"/>
  </marker>
  <marker id="graphArrow" markerWidth="12" markerHeight="12" refX="9" refY="0" viewBox="0 -5 10 10" orient="0">
    <path d="M0,-5L10,0L0,5" fill="black"/>
  </marker>
  <marker id="pipelineArrow" markerWidth="5" markerHeight="5" refX="9" refY="0" viewBox="0 -5 10 10" orient="0">
    <path d="M0,-5L10,0L0,5" fill="black"/>
  </marker>
</defs>
<rect x="0" y="0" width="800" height="500" fill="url(#wardleyGradient)" id="fillArea"/>
<g id="valueChain" transform="translate(0,500) rotate(270)">
  <line x1="0" y1="0" x2="500" y2="0" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="0" y1="140" x2="500" y2="140" stroke="#b8b8b8" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="0" y1="320" x2="500" y2="320" stroke="#b8b8b8" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="0" y1="560" x2="500" y2="560" stroke="#b8b8b8" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="250" y="-8" text-anchor="middle" font-size="12px" font-family="Consolas, Lucida Console, monospace" fill="black">Value Chain</text>
</g>
<g id="Evolution" transform="translate(0,500)">
  <line x1="0" y1="0" x2="798" y2="0" stroke="black" stroke-width="1" marker-end="url(#graphArrow)"/>
  <text x="0" y="1em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">Genesis</text>
  <text x="145" y="1em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">Custom-Built</text>
  <text x="325" y="1em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">Product</text>
  <text x="325" y="2em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">(+rental)</text>
  <text x="565" y="1em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">Commodity</text>
  <text x="565" y="2em" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">(+utility)</text>
  <text x="800" y="1.8em" text-anchor="end" font-size="11px" font-family="Consolas, Lucida Console, monospace" fill="black">Evolution</text>
</g>
